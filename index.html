<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ניהול תחזוקת צי רכב</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f6b6b">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="צי רכב">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f0;--card:#fff;--tx:#14212b;--mut:#5d6b76;--bd:#dde2dd;--pri:#0f6b6b;--ok:#1a7f4b;--warn:#8a5a00;--bad:#b3261e;--okb:#e0f3e8;--warnb:#fcefcf;--badb:#fbe3e1;--odb:#14212b;--odt:#f1f3f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#11171c;--card:#1a2229;--tx:#e6ebee;--mut:#90a0ab;--bd:#2a353e;--pri:#1f8585;--ok:#5ad39a;--warn:#f0c15a;--bad:#ff8c84;--okb:#16352a;--warnb:#3a2f14;--badb:#3d1c1a;--odb:#e6ebee;--odt:#11171c}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Heebo,system-ui,Arial,sans-serif;line-height:1.5}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:22px 0 8px;color:var(--mut);font-weight:500}h3{margin:0;font-size:15px}
main{max-width:900px;margin:0 auto;padding:16px}
select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:9px 10px;width:100%}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:12px}
[id^="sec-"]{scroll-margin-top:16px}.stats .card{margin:0}button.stat-link{font:inherit;color:inherit;text-align:start;cursor:pointer;border-color:var(--pri)}.stats b{display:block;font-size:22px}
small{color:var(--mut);font-size:12px}
.list{padding:2px 14px}
.row{display:flex;justify-content:space-between;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row input,.row select{width:auto;flex:1;min-width:120px}
.b{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500}
.ok{background:var(--okb);color:var(--ok)}.warn{background:var(--warnb);color:var(--warn)}.bad{background:var(--badb);color:var(--bad)}
.scroll{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-weight:500;font-size:12px}tr:last-child td{border:0}
label.filebtn{display:inline-block;text-align:center;cursor:pointer}.filebtn input{display:none}
.steps{margin:8px 0 10px;padding-inline-start:22px;font-size:14px;line-height:1.6}.steps li{margin-bottom:6px}
.form,.more,.manual{display:grid;gap:10px}.more[hidden],.manual[hidden],.svcmsg[hidden]{display:none}.svcmsg{margin:0;padding:10px 12px;border-radius:8px;font-size:14px}.note{margin:0;font-size:14px;color:var(--mut)}label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.login{max-width:380px;margin:40px auto}
.btn{font:inherit;font-weight:500;background:var(--pri);color:#fff;border:0;border-radius:6px;padding:10px 14px;cursor:pointer}
.btn:disabled{opacity:.6}
.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd)}.sm{padding:5px 12px;font-size:13px}
#who{display:flex;gap:10px;align-items:center}
#tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}#tabs:empty{display:none}
.tab{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:7px 16px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.odo{display:flex;gap:3px;direction:ltr;margin:12px 0}
.odo i{font-style:normal;background:var(--odb);color:var(--odt);width:36px;height:50px;display:grid;place-items:center;border-radius:5px;font-size:28px;font-weight:700}
.odo small{align-self:end;margin-inline-start:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:2px 14px;margin-bottom:10px}
summary{cursor:pointer;padding:12px 0;font-weight:500}
details ol{margin:0 0 12px;padding-inline-start:20px}details li{margin-bottom:8px}details a{color:var(--tx);text-decoration:underline}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:10px;overflow-x:auto;font-size:12px;direction:ltr;text-align:left;margin:8px 0}
.remind{border-color:var(--warn);background:var(--warnb);color:var(--warn)}
a.btn{text-decoration:none;display:inline-block}
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:12px}
.vcard{font:inherit;color:inherit;text-align:start;cursor:pointer;display:grid;gap:4px;margin:0;align-content:start;width:100%}
.vcard b{font-size:16px}.vcard .tags{margin-top:4px}.vkm{font-weight:500}
.rowlink{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:start;cursor:pointer;display:grid;gap:2px}
.instline{display:block;width:100%;margin-bottom:12px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#ov.on{display:flex}#ov img{max-width:100%;max-height:100%;border-radius:6px}
</style>
</head>
<body>
<header><h1>ניהול תחזוקת צי רכב</h1><div id="who"></div></header>
<main><div id="tabs"></div><div id="instbar"></div><div id="view"><div class="card">טוען...</div></div></main>
<div id="ov"></div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://rodlmlsdgwqyxqaimkfm.supabase.co',SB_KEY='sb_publishable_DMUQ4f5dSXX3hmLhJ1M8Ew_hq8Zq90O';
const DAY=864e5,TYPES={periodic:'טיפול תקופתי',tires:'החלפת צמיגים',brakes:'בלמים',repair:'תקלה / תיקון',other:'אחר'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmt=n=>Number(n||0).toLocaleString('he-IL');
const fd=s=>s?new Date(s).toLocaleDateString('he-IL'):'—';
const cls=l=>['ok','warn','bad'][l];
const num=x=>x===''||x==null?null:Number(x);
let sb,me=null,ui={tab:'dash'},D={profiles:[],vehicles:[],services:[],settings:{service_interval_km:10000,service_interval_months:12}};
const vname=v=>`${esc(v.model)} · ${esc(v.plate)}`;
const drv=id=>esc((D.profiles.find(p=>p.id===id)||{}).full_name||'לא משויך');
const byId=id=>D.vehicles.find(v=>v.id===id);

async function init(){
 if(!window.supabase){$('#view').innerHTML='<div class="card">לא ניתן לטעון את הספרייה. בדוק חיבור לאינטרנט ורענן את הדף.</div>';return}
 sb=supabase.createClient(SB_URL,SB_KEY);
 const{data:{session}}=await sb.auth.getSession();
 session?start():showLogin();
}
async function start(){
 const{data:{user}}=await sb.auth.getUser();
 if(!user){showLogin();return}
 await load(user.id);render();track(user.id);
}
async function load(uid){
 const r=await Promise.all([sb.from('profiles').select('*'),sb.from('vehicles').select('*').order('plate'),sb.from('services').select('*').order('service_date',{ascending:false}),sb.from('settings').select('*').maybeSingle(),sb.from('km_updates').select('vehicle_id,created_at').order('created_at',{ascending:false}).limit(2000)]);
 const bad=r.find(x=>x.error);if(bad){console.error(bad.error);toast('שגיאה בטעינת הנתונים')}
 D.profiles=r[0].data||[];D.vehicles=r[1].data||[];D.services=r[2].data||[];if(r[3].data)D.settings=r[3].data;D.kmu=r[4].data||[];
 me=D.profiles.find(p=>p.id===uid)||{id:uid,role:'driver',full_name:''};
 D.inst=[];
 if(me.role==='manager'){const q=await sb.from('app_installs').select('*');D.inst=q.error?null:(q.data||[])}
}
function showLogin(){
 me=null;$('#who').innerHTML='';$('#tabs').innerHTML='';drawInst();
 $('#view').innerHTML=`<form class="card form login" data-f="login"><h3>כניסה למערכת</h3><label>אימייל<input type="email" name="email" autocomplete="username" required></label><label>סיסמה<input type="password" name="password" autocomplete="current-password" required></label><button class="btn">כניסה</button></form>`;
}

function svcStatus(v){
 const last=D.services.filter(s=>s.vehicle_id===v.id&&s.type==='periodic').sort((a,b)=>b.km-a.km)[0];
 if(!last)return{lvl:1,txt:'אין טיפול תקופתי רשום'};
 const left=last.km+D.settings.service_interval_km-v.km;
 const due=new Date(last.service_date);due.setMonth(due.getMonth()+D.settings.service_interval_months);
 const days=Math.round((due-Date.now())/DAY);
 if(left<=0)return{lvl:2,txt:`טיפול באיחור של ${fmt(-left)} ק"מ`};
 if(days<=0)return{lvl:2,txt:`טיפול באיחור של ${-days} ימים`};
 if(left<=1000||days<=30)return{lvl:1,txt:`טיפול בעוד ${fmt(left)} ק"מ או ${days} ימים`};
 return{lvl:0,txt:`טיפול בעוד ${fmt(left)} ק"מ`};
}
function docs(v){
 const o=[];
 [['טסט',v.test_date],['ביטוח',v.insurance_date]].forEach(([n,dt])=>{
  if(!dt)return;const days=Math.round((new Date(dt)-Date.now())/DAY);
  if(days<=30)o.push({lvl:days<0?2:1,txt:days<0?`${n} פג לפני ${-days} ימים`:`${n} פג בעוד ${days} ימים`});
 });
 return o;
}
const REM_DAYS=30,JUMP=20000;
const jumpMsg=()=>`הקפיצה בק"מ גדולה מדי (מעל ${fmt(JUMP)}). בדוק שהמספר נכון, ואם הוא נכון פנה למנהל`;
function kmAge(v){
 const t=[v.created_at,...(D.kmu||[]).filter(u=>u.vehicle_id===v.id).map(u=>u.created_at),...D.services.filter(x=>x.vehicle_id===v.id).map(x=>x.created_at)].filter(Boolean).map(x=>new Date(x).getTime());
 return t.length?Math.floor((Date.now()-Math.max(...t))/DAY):0;
}
function waTo(p,m){
 let n=String(p||'').replace(/\D/g,'');if(!n)return '';
 if(n.startsWith('0'))n='972'+n.slice(1);
 return `https://wa.me/${n}?text=${encodeURIComponent(m)}`;
}
const siteUrl=()=>location.origin+location.pathname;
const waLink=(p,name)=>waTo(p,`שלום ${name}, תזכורת חודשית: נא לעדכן קילומטראז' באפליקציית הצי: ${siteUrl()}`);
const waInstall=(p,name)=>waTo(p,`שלום ${name},
כדי להתקין את אפליקציית צי הרכב בטלפון:

1. פותחים את הקישור (באייפון חשוב לפתוח ב-Safari):
${siteUrl()}

2. מתחברים עם האימייל והסיסמה.

3. אחרי ההתחברות מופיע למעלה כרטיס "התקינו את האפליקציה בטלפון". עושים בדיוק מה שכתוב בו, צעד אחרי צעד.

4. מעכשיו פותחים את האפליקציה רק מהאייקון החדש במסך הבית.`);
let instEv=null,instDone=false;
function drawInst(){
 const el=$('#instbar');if(!el)return;
 if(!me||me.role!=='driver'||instDone||isApp()){el.innerHTML='';return}
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 const steps=ios?['פותחים את האתר ב-Safari (אייקון המצפן הכחול).','לוחצים על כפתור השיתוף (ריבוע עם חץ למעלה). אם אין כפתור כזה, לוחצים על שלוש הנקודות ⋯ ליד שורת הכתובת, ואז על "שיתוף".','גוללים למטה ולוחצים על "הוספה למסך הבית".','משאירים דלוק את "פתיחה כאפליקציית אינטרנט" ולוחצים "הוספה" למעלה.']:['לוחצים על שלוש הנקודות ⋮ בפינה העליונה של הדפדפן.','לוחצים על "התקנת אפליקציה" (או "הוספה למסך הבית").','לוחצים "התקנה".'];
 const how=instEv?'<br><small>לוחצים על הכפתור, ואחרי זה על "התקנה" בחלון שייפתח.</small>':`<ol class="steps">${steps.map(s=>`<li>${s}</li>`).join('')}</ol><small>מעכשיו פותחים את האפליקציה רק מהאייקון החדש במסך הבית. אם כבר התקנתם, פתחו אותה משם.</small>`;
 el.innerHTML=`<div class="card"><b>התקינו את האפליקציה בטלפון</b><br><small>היא תיפתח ישר מהאייקון, בלי להקליד כתובת.</small>${how}${instEv?'<div class="tags" style="margin-top:10px"><button class="btn sm" data-a="install">התקנה</button></div>':''}</div>`;
}
function isApp(){
 try{return ['standalone','fullscreen','minimal-ui'].some(m=>matchMedia(`(display-mode: ${m})`).matches)||navigator.standalone===true}catch(e){return false}
}
async function track(uid,force){
 try{
  const now=new Date().toISOString(),app=isApp(),row={user_id:uid,last_seen:now};
  if(force||app)row.installed=true;
  if(app)row.last_app_open=now;
  const{error}=await sb.from('app_installs').upsert(row,{onConflict:'user_id'});
  if(error)console.warn('app_installs',error.message);
 }catch(e){console.warn(e)}
}
function attention(){
 return D.vehicles.map(v=>{
  const s=svcStatus(v),items=[],age=v.driver_id?kmAge(v):0;
  if(s.lvl)items.push({lvl:s.lvl,txt:s.txt});
  docs(v).forEach(x=>items.push(x));
  const stale=age>=REM_DAYS;
  if(stale)items.push({lvl:1,txt:`ק"מ לא עודכן ${age} ימים`});
  return{v,items,age,stale,lvl:Math.max(0,...items.map(i=>i.lvl))};
 }).filter(x=>x.items.length).sort((a,b)=>b.lvl-a.lvl||b.age-a.age);
}
function instLine(){
 if(!Array.isArray(D.inst))return '';
 const ds=D.profiles.filter(p=>p.role==='driver');if(!ds.length)return '';
 const n=ds.filter(p=>(D.inst.find(x=>x.user_id===p.id)||{}).installed).length;
 if(n>=ds.length)return '';
 return `<button type="button" class="card stat-link instline" data-a="tab" data-v="mng" data-to="sec-inst"><b>התקנת האפליקציה: ${n} מתוך ${ds.length} נהגים</b><br><small>לפירוט ולשליחת הוראות</small></button>`;
}
function installBox(){
 if(D.inst===null)return `<h2 id="sec-inst">התקנת האפליקציה</h2><div class="card"><small>כדי לראות מי התקין את האפליקציה צריך ליצור טבלה אחת ב-Supabase. ההוראות במדריך, תחת "מי התקין את האפליקציה".</small></div>`;
 const ds=D.profiles.filter(p=>p.role==='driver');
 if(!ds.length)return '';
 const get=p=>D.inst.find(x=>x.user_id===p.id);
 const rows=ds.map(p=>{
  const r=get(p),w=waInstall(p.phone,p.full_name||'');
  const st=r&&r.installed?['ok','מותקן']:r?['warn','נכנס מהדפדפן']:['bad','לא נראה עדיין'];
  const seen=r?`נכנס לאחרונה ${fd(r.last_seen)}`:'';
  const btn=r&&r.installed?'':(w?`<a class="btn sm" href="${w}" target="_blank" rel="noopener">שלח הוראות</a>`:'<small>אין מספר טלפון</small>');
  return `<div class="row"><span>${esc(p.full_name||'ללא שם')} <small>${seen}</small></span><span class="tags"><span class="b ${st[0]}">${st[1]}</span>${btn}</span></div>`}).join('');
 const n=ds.filter(p=>(get(p)||{}).installed).length;
 return `<h2 id="sec-inst">התקנת האפליקציה (${n} מתוך ${ds.length})</h2><div class="card list">${rows}</div><p style="margin:-4px 0 12px"><small>"לא נראה עדיין": לא נכנס לאתר מאז העדכון. "נכנס מהדפדפן": נכנס, אבל לא פתח כאפליקציה מותקנת.</small></p>`;
}
function svcForm(vid){
 const m=me.role==='manager';
 return `<form class="card form" data-f="svc"><h3>רישום טיפול</h3>
 ${vid?`<input type="hidden" name="vid" value="${vid}">`:`<label>רכב<select name="vid">${D.vehicles.map(v=>`<option value="${v.id}">${vname(v)}</option>`).join('')}</select></label>`}
 <label>סוג טיפול<select name="type" required><option value="" selected disabled>בחרו סוג טיפול</option>${Object.entries(TYPES).map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></label>
 <div class="more" hidden>
 <input type="hidden" name="manual" value=""><input type="hidden" name="uploaded" value="">
 <p class="note">מצלמים את החשבונית, והאתר קורא ממנה לבד את התאריך, הסכום, המוסך והק"מ.</p>
 <label>צילום חשבונית${m?' (אופציונלי)':''}<input type="file" name="receipt" accept="image/*" capture="environment"></label>
 <label>או בחירת תמונה מהגלריה<input type="file" name="receipt2" accept="image/*"></label>
 <p class="svcmsg warn" role="alert" hidden></p>
 <div class="manual" hidden>
 <label>תאריך<input type="date" name="date" value="${today()}"></label>
 <label>ק"מ בטיפול<input type="number" name="km" min="0"></label>
 <label>עלות (₪)<input type="number" name="cost" min="0" step="any"></label>
 <label>מוסך<input name="garage"></label>
 </div>
 <button class="btn">שמירת טיפול</button></div></form>`;
}
function svcTable(list){
 return `<div class="card scroll"><table><tr><th>תאריך</th><th>רכב</th><th>סוג</th><th>ק"מ</th><th>עלות</th><th>מוסך</th><th>קבלה</th></tr>${
 list.map(s=>{const v=byId(s.vehicle_id)||{model:'?',plate:''};
 return `<tr><td>${fd(s.service_date)}</td><td>${vname(v)}</td><td>${TYPES[s.type]||esc(s.type)}</td><td>${fmt(s.km)}</td><td>₪${fmt(s.cost)}</td><td>${esc(s.garage||'')}</td><td>${s.invoice_path?`<button class="btn ghost sm" data-a="rc" data-p="${esc(s.invoice_path)}">צפייה</button>`:'—'}</td></tr>`}).join('')
 ||'<tr><td colspan="7">עוד לא נרשמו טיפולים</td></tr>'}</table></div>`;

// ומחזיר תאריך, סכום, שם מוסך וק"מ. נדרש סוד בשם ANTHROPIC_API_KEY.
import { createClient } from 'npm:@supabase/supabase-js@2'

const cors = {
  'Access-Control-Allow-Origin': '*',
  'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type',
}
const reply = (body: unknown, status = 200) =>
  new Response(JSON.stringify(body), {
    status,
    headers: { ...cors, 'Content-Type': 'application/json' },
  })

const PROMPT = [
  'This is a photo of a receipt or invoice for a vehicle service, repair, tires or parts from an Israeli business.',
  'It is mostly in Hebrew, may be handwritten, and may show several papers (for example an invoice and a credit card slip).',
  'Dates in Israel are day/month/year.',
  'Answer with ONLY one JSON object and nothing else:',
  '{"readable": true or false, "date": "YYYY-MM-DD" or null, "cost": number or null, "km": number or null, "garage": string or null, "plate": string or null, "summary": string or null}',
  'cost = the final total actually paid, in NIS, including VAT (for example the total to pay, or the amount on the card slip), as a plain number.',
  'km = the vehicle odometer reading, only if it is clearly written, otherwise null.',
  'garage = the business name.',
  'plate = the vehicle license plate digits only, only if a vehicle number is written, otherwise null.',
  'summary = what was done, in Hebrew, at most 60 characters, or null.',
  'Never guess. Use null for anything that is missing or unclear.',
  'If the image is not a receipt or an invoice, answer {"readable": false}.',
].join(' ')

Deno.serve(async (req) => {
  if (req.method === 'OPTIONS') return new Response('ok', { headers: cors })
  try {
    // 1. רק משתמש מחובר שיש לו רכב (או מנהל) יכול להשתמש בשירות
    const token = (req.headers.get('Authorization') ?? '').replace('Bearer ', '')
    const pub = JSON.parse(Deno.env.get('SUPABASE_PUBLISHABLE_KEYS') ?? '{}')
    const anon = Deno.env.get('SUPABASE_ANON_KEY') ?? (Object.values(pub)[0] as string)
    const url = Deno.env.get('SUPABASE_URL')!
    const noSession = { persistSession: false, autoRefreshToken: false }
    const { data: u, error: ue } = await createClient(url, anon, { auth: noSession }).auth.getUser(token)
    if (ue || !u.user) return reply({ ok: false, error: 'unauthorized' }, 401)
    const db = createClient(url, anon, {
      auth: noSession,
      global: { headers: { Authorization: 'Bearer ' + token } },
    })
    const { data: veh } = await db.from('vehicles').select('id').limit(1)
    if (!veh || veh.length === 0) return reply({ ok: false, error: 'forbidden' }, 403)

    // 2. התמונה
    const { image } = await req.json()
    if (typeof image !== 'string' || image.length < 100 || image.length > 7000000) {
      return reply({ ok: false, error: 'bad image' }, 400)
    }
    const key = Deno.env.get('ANTHROPIC_API_KEY')
    if (!key) return reply({ ok: false, error: 'missing ANTHROPIC_API_KEY' }, 500)

    // 3. קריאה ל-Claude
    const ws = Deno.env.get('ANTHROPIC_WORKSPACE_ID')
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        ...(ws ? { 'anthropic-workspace-id': ws } : {}),
      },
      body: JSON.stringify({
        model: Deno.env.get('INVOICE_MODEL') ?? 'claude-sonnet-5-5',
        max_tokens: 500,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: image } },
            { type: 'text', text: PROMPT },
          ],
        }],
      }),
    })
    if (!r.ok) {
      console.error('anthropic', r.status, (await r.text()).slice(0, 300))
      return reply({ ok: false, error: 'ai ' + r.status }, 502)
    }
    const out = await r.json()
    const text = (out.content ?? []).map((c: { text?: string }) => c.text ?? '').join('')
    const a = text.indexOf('{')
    const b = text.lastIndexOf('}')
    if (a < 0 || b < a) return reply({ ok: false, error: 'no json' }, 502)
    return reply({ ok: true, data: JSON.parse(text.slice(a, b + 1)) })
  } catch (e) {
    console.error(e)
    return reply({ ok: false, error: String(e) }, 500)
  }
})`;

 <li>מוחקים מהטלפון קבצי index ישנים מתיקיית ההורדות, ואז מורידים את קובץ index.html החדש מהשיחה עם Claude.</li>
 <li>פותחים את דף ההעלאה ב-GitHub ובוחרים את הקובץ (אחרונים). ${L(gh+'/upload/main','דף ההעלאה')}</li>
 <li>אם השם הוא בדיוק index.html, לוחצים Commit changes. אם השם שונה (למשל index-.html), מוחקים את הישן ב-GitHub ומתקנים את השם החדש ל-index.html.</li>
 <li>מחכים דקה-שתיים. אפשר לבדוק שההעלאה הסתיימה (סימן וי ירוק). ${L(gh+'/actions','בדיקה שההעלאה עברה')} אחר כך סוגרים את האפליקציה לגמרי ופותחים מחדש. לבדיקה בלי זיכרון ישן: לשונית גלישה בסתר.</li>
 <li>תמיד פותחים את האתר מהכתובת kfirfleet.github.io/fleet ולא מקובץ בטלפון. ${L(site,'פתיחת האתר')}</li></ol></details>
 <details><summary>תיקון ק"מ</summary><ol>
 <li>ק"מ של רכב: ניהול ← עריכת ק"מ לרכב. ${go('mng','sec-kmfix','מעבר לעריכת ק"מ')}</li>
 <li>ק"מ שגוי בטיפול שנרשם: ב-SQL Editor מחליפים במספרים ובמספר הרישוי ומריצים. אם מופיע No rows returned, השורה שייכת לרכב אחר. ${sqlL}${pre(sql3)}</li></ol></details>
 <details><summary>איפוס סיסמה למשתמש</summary><ol>
 <li>ב-SQL Editor מחליפים את NEW_PASSWORD ואת האימייל (באותיות קטנות, גרשיים נשארים) ומריצים. את הסיסמה לא שומרים בשאילתה. ${sqlL}${pre(sql2)}</li>
 <li>סיסמת החשבון ב-Supabase עצמו מאפסים במסך הכניסה שלו, ב"שכחת סיסמה".</li></ol></details>
 <details><summary>תזכורות ק"מ חודשיות</summary><ol>
 <li>בסקירה, בקטע "דורש תשומת לב", מופיע "ק"מ לא עודכן X ימים" ליד רכבים שהנהג שלהם לא עדכן 30 יום, עם כפתור "שלח תזכורת" לוואטסאפ. ${go('dash',null,'מעבר לסקירה')}</li>
 <li>כפתור "שלח תזכורת" פותח וואטסאפ מוכן. לשם כך צריך מספר טלפון לנהג ב-ניהול ← נהגים. ${go('mng','sec-drivers','מעבר לנהגים')}</li></ol></details>
 <details><summary>מי התקין את האפליקציה</summary><ol>
 <li>פעם אחת בלבד: ב-SQL Editor מריצים את שני הקטעים הבאים, אחד אחרי השני. הקוד בטוח להרצה חוזרת, אז אם הדבקה נחתכה אפשר פשוט להריץ שוב. ${sqlL}${pre(sqlA)}${pre(sqlB)}</li>
 <li>אחרי זה, ב-ניהול, בקטע "התקנת האפליקציה", מופיע מצב של כל נהג. בסקירה מופיעה שורה קטנה כל עוד לא כולם התקינו. ${go('mng','sec-inst','מעבר להתקנת האפליקציה')}</li>
 <li>"מותקן": הנהג פתח את האפליקציה מהאייקון. "נכנס מהדפדפן": נכנס לאתר אבל עוד לא התקין. "לא נראה עדיין": לא נכנס לאתר מאז העדכון.</li>
 <li>לנהג שעוד לא התקין יש כפתור "שלח הוראות" שפותח וואטסאפ מוכן.</li>
 <li>לנהגים מופיע בראש האפליקציה כרטיס "התקינו את האפליקציה בטלפון". בכרום באנדרואיד יש בו כפתור "התקנה" שמתקין בלחיצה אחת. אי אפשר להסתיר אותו: הוא נעלם רק כשהנהג פותח את האפליקציה מהאייקון.</li>
 <li>המצב מתעדכן רק כשהנהג פותח את האתר או האפליקציה. נהג שהתקין ולא פתח עדיין לא יופיע כמותקן.</li></ol></details>
 <details><summary>קריאת חשבוניות אוטומטית</summary><ol>
 <li>הנהג בוחר רק סוג טיפול ומצלם את החשבונית. האתר קורא ממנה את התאריך, הסכום, שם המוסך והק"מ, ושומר לבד. אם אין ק"מ בחשבונית, נלקח הק"מ האחרון של הרכב.</li>
 <li>אם משהו חסר או לא ברור (סכום, תאריך, או מספר רכב שונה מהרכב שנבחר), נפתחים לנהג השדות עם מה שנקרא, והוא משלים ושומר.</li>
 <li>הקריאה עולה כסף קטן (בדרך כלל אגורות בודדות לחשבונית) ועוברת דרך חשבון נפרד ב-Claude Console, לא דרך המנוי הרגיל של Claude. בלי ההגדרה הזו האתר ממשיך לעבוד, והנהג ממלא את הפרטים בעצמו.</li>
 <li>הגדרה חד-פעמית, שלב 1: נכנסים ל-Claude Console, מוסיפים קרדיט בהגדרות החיוב (Billing), ואז ב-API keys לוחצים Create key ומעתיקים את המפתח (מתחיל ב-sk-ant). הוא מוצג פעם אחת בלבד. ${L('https://platform.claude.com/settings/keys','מפתחות API')}</li>
 <li>שלב 2: שומרים את המפתח ב-Supabase: Edge Functions ← Secrets. בשם (Key) כותבים ANTHROPIC_API_KEY, בערך (Value) מדביקים את המפתח, ולוחצים Save. ${L(sb0+'/functions/secrets','פתיחת Secrets')}</li>
 <li>שלב 3: Edge Functions ← Deploy a new function ← Via Editor. נותנים לפונקציה את השם read-invoice, מוחקים את הקוד שיש שם, מדביקים את הקוד הבא ולוחצים Deploy function. ${L(sb0+'/functions','פתיחת Edge Functions')}${pre(fnCode)}</li>
 <li>בדיקה: באתר ← טיפולים, בוחרים רכב וסוג טיפול ומצלמים חשבונית. אם הכול תקין, הטיפול נשמר לבד עם הסכום והתאריך מהחשבונית.</li>
 <li>אם זה לא עובד: ב-Supabase, בתוך Edge Functions ← read-invoice, בלשונית Logs רואים את השגיאה. "ai 401" או "ai 400" אומר שהמפתח שגוי או שנגמר הקרדיט.</li>
 <li>שגיאה בקריאה לא פוגעת בנתונים: הנהג רואה את השדות ומשלים אותם בעצמו.</li></ol></details>
 <details><summary>רישיון רכב</summary><ol>
 <li>פעם אחת בלבד: ב-SQL Editor מריצים את הקטע הבא. ${sqlL}${pre(sqlC)}</li>
 <li>אחרי זה: ניהול ← רישיון רכב. ליד כל רכב לוחצים "העלאה", ומצלמים את הרישיון או בוחרים תמונה מהגלריה. ${go('mng','sec-lic','מעבר לרישיון רכב')}</li>
 <li>כשמתקבל רישיון חדש (למשל אחרי טסט שנתי) לוחצים "החלפה". התמונה הקודמת נמחקת.</li>
 <li>לצפייה לוחצים "צפייה". הרישיון מוצג רק למנהל.</li>
 <li>רק אם ההעלאה נכשלת: מריצים גם את הקטע הבא ומנסים שוב. ${sqlL}${pre(sqlD)}</li></ol></details>
 <details><summary>גיבוי נתונים ידני</summary><ol>
 <li>ב-SQL Editor מריצים select * from services; (וכך גם vehicles, km_updates, profiles). ${sqlL}</li>
 <li>בתוצאות לוחצים Export ← CSV ושומרים את הקובץ.</li>
 <li>בתוכנית החינמית אין גיבוי אוטומטי, ולכן כדאי לעשות את זה אחת לכמה שבועות.</li></ol></details>
 <details><summary>בעיות נפוצות</summary><ol>
 <li>"אימייל או סיסמה שגויים": אימייל באותיות קטנות ואיפוס סיסמה לפי המדריך.</li>
 <li>נהג חדש לא מופיע: להריץ את שאילתת הפרופילים (בקטע "הוספת נהג חדש"). ${sqlL}</li>
 <li>רואים גרסה ישנה: לפתוח מהכתובת, או בלשונית גלישה בסתר. ${L(site,'פתיחת האתר')}</li>
 <li>"הקפיצה בק"מ גדולה מדי": לתקן ב-ניהול ← עריכת ק"מ לרכב. ${go('mng','sec-kmfix','מעבר לעריכת ק"מ')}</li>
 <li>האתר לא נטען או מציג שגיאה אחרי כמה ימים בלי שימוש: ייתכן ש-Supabase השהה את הפרויקט. נכנסים לדף הפרויקט ולוחצים Restore project (או Resume). ${L(sb0,'דף הפרויקט')}</li></ol></details>`;

function shrink(file,max=1600){
 return new Promise((ok,no)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{
   const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
   c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
   c.toBlob(b=>b?ok(b):no(new Error('blob')),'image/jpeg',0.8);
  };
  img.onerror=()=>{URL.revokeObjectURL(u);no(new Error('img'))};
  img.src=u;
 });
}
async function readInvoice(blob){
 try{
  const image=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(blob)});
  const t=new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),45000));
  const{data,error}=await Promise.race([sb.functions.invoke('read-invoice',{body:{image}}),t]);
  if(error||!data||!data.ok||!data.data||data.data.readable===false)return null;
  return data.data;
 }catch(e){console.error(e);return null}
}
function parseInv(d,v){
 const dg=x=>String(x??'').replace(/\D/g,'');
 let date=null,dateBad=false;
 if(d.date){
  const t=Date.parse(d.date),maxD=new Date(Date.now()+DAY).toISOString().slice(0,10);
  if(/^\d{4}-\d{2}-\d{2}$/.test(d.date)&&t&&d.date<=maxD&&t>Date.now()-400*DAY)date=d.date;else dateBad=true;
 }
 let cost=Number(d.cost);cost=Number.isFinite(cost)&&cost>0&&cost<1e6?Math.round(cost*100)/100:null;
 let km=Math.round(Number(d.km));if(!Number.isFinite(km)||km<=0)km=null;
 if(km!=null&&v&&(km>v.km+JUMP||km<v.km-JUMP))km=null;
 const pl=dg(d.plate),vp=dg(v&&v.plate);
 return{date,dateBad,cost,km,garage:d.garage?String(d.garage).trim().slice(0,80):null,plate:pl,plateBad:!!(pl&&vp&&pl!==vp)};
}

 if(a==='allsvc'){ui.year=null;render();window.scrollTo(0,0)}
 if(a==='install'&&instEv){const ev=instEv;instEv=null;ev.prompt();try{await ev.userChoice}catch(e){}drawInst()} if(a==='rc'){
  const{data,error}=await sb.storage.from('invoices').createSignedUrl(b.dataset.p,300);
  if(error){toast('לא ניתן לפתוח את הקבלה');return}
  $('#ov').innerHTML=`<img src="${data.signedUrl}" alt="מסמך">`;$('#ov').classList.add('on');
 }
 if(a==='copy'){
  try{await navigator.clipboard.writeText(b.previousElementSibling.textContent);toast('הועתק')}catch(e){toast('לא ניתן להעתיק, סמן ידנית')}
 }
 if(a==='out'){ui.vid=null;await sb.auth.signOut();showLogin()}
 if(a==='rename'){
  const[ni,pi]=b.closest('.row').querySelectorAll('input');const name=ni.value.trim();if(!name)return;
  const{error}=await sb.from('profiles').update({full_name:name,phone:pi.value.trim()||null}).eq('id',b.dataset.id);
  const[ok,msg]=res(error,'הפרטים נשמרו');if(ok){await load(me.id);render()}toast(msg);
 }
});
document.addEventListener('change',async e=>{
 const id=e.target.dataset.assign;if(!id)return;
 const{error}=await sb.from('vehicles').update({driver_id:e.target.value||null}).eq('id',id);
 const[ok,msg]=res(error,'השיוך עודכן');if(ok){await load(me.id);render()}toast(msg);
});
document.addEventListener('change',async e=>{
 const t=e.target,vid=t.dataset&&t.dataset.lic;if(!vid||!t.files||!t.files[0])return;
 const f=t.files[0],old=(byId(vid)||{}).license_path;t.value='';
 toast('מעלה את הרישיון...');
 let path=null;
 try{
  const blob=await shrink(f,2200);path=`${vid}/license-${crypto.randomUUID()}.jpg`;
  const{error:ue}=await sb.storage.from('invoices').upload(path,blob,{contentType:'image/jpeg'});
  if(ue){console.error(ue);toast('העלאת הרישיון נכשלה. הפרטים במדריך, תחת "רישיון רכב"');return}
 }catch(err){console.error(err);toast('לא ניתן לעבד את התמונה');return}
 const{error}=await sb.from('vehicles').update({license_path:path,license_at:new Date().toISOString()}).eq('id',vid);
 if(error){console.error(error);await sb.storage.from('invoices').remove([path]);toast((error.message||'').includes('license_')?'צריך להריץ פקודה אחת ב-Supabase. ההוראות במדריך, תחת "רישיון רכב"':'השמירה נכשלה, נסה שוב');return}
 if(old){try{await sb.storage.from('invoices').remove([old])}catch(err){console.error(err)}}
 await load(me.id);render();toast('הרישיון נשמר');
});
document.addEventListener('change',e=>{const t=e.target;if(t.matches&&t.matches('form[data-f="svc"] select[name="type"]')){const m=t.form.querySelector('.more');if(m)m.hidden=!t.value}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;drawInst()});
window.addEventListener('appinstalled',()=>{instEv=null;instDone=true;drawInst();if(sb&&me)track(me.id,true)});
init();
</script>
</body>
</html>
