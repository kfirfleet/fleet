<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ניהול תחזוקת צי רכב</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f0;--card:#fff;--tx:#14212b;--mut:#5d6b76;--bd:#dde2dd;--pri:#0f6b6b;--ok:#1a7f4b;--warn:#8a5a00;--bad:#b3261e;--okb:#e0f3e8;--warnb:#fcefcf;--badb:#fbe3e1;--odb:#14212b;--odt:#f1f3f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#11171c;--card:#1a2229;--tx:#e6ebee;--mut:#90a0ab;--bd:#2a353e;--pri:#1f8585;--ok:#5ad39a;--warn:#f0c15a;--bad:#ff8c84;--okb:#16352a;--warnb:#3a2f14;--badb:#3d1c1a;--odb:#e6ebee;--odt:#11171c}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Heebo,system-ui,Arial,sans-serif;line-height:1.5}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:22px 0 8px;color:var(--mut);font-weight:500}h3{margin:0;font-size:15px}
main{max-width:900px;margin:0 auto;padding:16px}
select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:9px 10px;width:100%}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stats .card{margin:0}.stats b{display:block;font-size:22px}
small{color:var(--mut);font-size:12px}
.list{padding:2px 14px}
.row{display:flex;justify-content:space-between;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row input,.row select{width:auto;flex:1;min-width:120px}
.b{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500}
.ok{background:var(--okb);color:var(--ok)}.warn{background:var(--warnb);color:var(--warn)}.bad{background:var(--badb);color:var(--bad)}
.scroll{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-weight:500;font-size:12px}tr:last-child td{border:0}
.form{display:grid;gap:10px}label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.login{max-width:380px;margin:40px auto}
.btn{font:inherit;font-weight:500;background:var(--pri);color:#fff;border:0;border-radius:6px;padding:10px 14px;cursor:pointer}
.btn:disabled{opacity:.6}
.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd)}.sm{padding:5px 12px;font-size:13px}
#who{display:flex;gap:10px;align-items:center}
#tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}#tabs:empty{display:none}
.tab{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:7px 16px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.odo{display:flex;gap:3px;direction:ltr;margin:12px 0}
.odo i{font-style:normal;background:var(--odb);color:var(--odt);width:36px;height:50px;display:grid;place-items:center;border-radius:5px;font-size:28px;font-weight:700}
.odo small{align-self:end;margin-inline-start:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#ov.on{display:flex}#ov img{max-width:100%;max-height:100%;border-radius:6px}
</style>
</head>
<body>
<header><h1>ניהול תחזוקת צי רכב</h1><div id="who"></div></header>
<main><div id="tabs"></div><div id="view"><div class="card">טוען...</div></div></main>
<div id="ov"></div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://rodlmlsdgwqyxqaimkfm.supabase.co',SB_KEY='sb_publishable_DMUQ4f5dSXX3hmLhJ1M8Ew_hq8Zq90O';
const DAY=864e5,TYPES={periodic:'טיפול תקופתי',tires:'החלפת צמיגים',brakes:'בלמים',repair:'תקלה / תיקון',other:'אחר'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmt=n=>Number(n||0).toLocaleString('he-IL');
const fd=s=>s?new Date(s).toLocaleDateString('he-IL'):'—';
const cls=l=>['ok','warn','bad'][l];
const num=x=>x===''||x==null?null:Number(x);
let sb,me=null,ui={tab:'dash'},D={profiles:[],vehicles:[],services:[],settings:{service_interval_km:10000,service_interval_months:12}};
const vname=v=>`${esc(v.model)} · ${esc(v.plate)}`;
const drv=id=>esc((D.profiles.find(p=>p.id===id)||{}).full_name||'לא משויך');
const byId=id=>D.vehicles.find(v=>v.id===id);

async function init(){
 if(!window.supabase){$('#view').innerHTML='<div class="card">לא ניתן לטעון את הספרייה. בדוק חיבור לאינטרנט ורענן את הדף.</div>';return}
 sb=supabase.createClient(SB_URL,SB_KEY);
 const{data:{session}}=await sb.auth.getSession();
 session?start():showLogin();
}
async function start(){
 const{data:{user}}=await sb.auth.getUser();
 if(!user){showLogin();return}
 await load(user.id);render();
}
async function load(uid){
 const r=await Promise.all([sb.from('profiles').select('*'),sb.from('vehicles').select('*').order('plate'),sb.from('services').select('*').order('service_date',{ascending:false}),sb.from('settings').select('*').maybeSingle()]);
 const bad=r.find(x=>x.error);if(bad){console.error(bad.error);toast('שגיאה בטעינת הנתונים')}
 D.profiles=r[0].data||[];D.vehicles=r[1].data||[];D.services=r[2].data||[];if(r[3].data)D.settings=r[3].data;
 me=D.profiles.find(p=>p.id===uid)||{id:uid,role:'driver',full_name:''};
}
function showLogin(){
 me=null;$('#who').innerHTML='';$('#tabs').innerHTML='';
 $('#view').innerHTML=`<form class="card form login" data-f="login"><h3>כניסה למערכת</h3><label>אימייל<input type="email" name="email" autocomplete="username" required></label><label>סיסמה<input type="password" name="password" autocomplete="current-password" required></label><button class="btn">כניסה</button></form>`;
}

function svcStatus(v){
 const last=D.services.filter(s=>s.vehicle_id===v.id&&s.type==='periodic').sort((a,b)=>b.km-a.km)[0];
 if(!last)return{lvl:1,txt:'אין טיפול תקופתי רשום'};
 const left=last.km+D.settings.service_interval_km-v.km;
 const due=new Date(last.service_date);due.setMonth(due.getMonth()+D.settings.service_interval_months);
 const days=Math.round((due-Date.now())/DAY);
 if(left<=0)return{lvl:2,txt:`טיפול באיחור של ${fmt(-left)} ק"מ`};
 if(days<=0)return{lvl:2,txt:`טיפול באיחור של ${-days} ימים`};
 if(left<=1000||days<=30)return{lvl:1,txt:`טיפול בעוד ${fmt(left)} ק"מ או ${days} ימים`};
 return{lvl:0,txt:`טיפול בעוד ${fmt(left)} ק"מ`};
}
function docs(v){
 const o=[];
 [['טסט',v.test_date],['ביטוח',v.insurance_date]].forEach(([n,dt])=>{
  if(!dt)return;const days=Math.round((new Date(dt)-Date.now())/DAY);
  if(days<=30)o.push({lvl:days<0?2:1,txt:days<0?`${n} פג לפני ${-days} ימים`:`${n} פג בעוד ${days} ימים`});
 });
 return o;
}
function alerts(){
 const a=[];
 D.vehicles.forEach(v=>{const s=svcStatus(v);if(s.lvl)a.push({v,...s});docs(v).forEach(x=>a.push({v,...x}))});
 return a.sort((x,y)=>y.lvl-x.lvl);
}
function svcForm(vid){
 return `<form class="card form" data-f="svc"><h3>רישום טיפול</h3>
 ${vid?`<input type="hidden" name="vid" value="${vid}">`:`<label>רכב<select name="vid">${D.vehicles.map(v=>`<option value="${v.id}">${vname(v)}</option>`).join('')}</select></label>`}
 <label>סוג טיפול<select name="type">${Object.entries(TYPES).map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></label>
 <label>תאריך<input type="date" name="date" value="${today()}" required></label>
 <label>ק"מ בטיפול<input type="number" name="km" min="0" required></label>
 <label>עלות (₪)<input type="number" name="cost" min="0" step="any"></label>
 <label>מוסך<input name="garage"></label>
 <label>צילום קבלה${me.role==='manager'?' (אופציונלי)':''}<input type="file" name="receipt" accept="image/*"${me.role==='manager'?'':' required'}></label>
 <button class="btn">שמירת טיפול</button></form>`;
}
function svcTable(list){
 return `<div class="card scroll"><table><tr><th>תאריך</th><th>רכב</th><th>סוג</th><th>ק"מ</th><th>עלות</th><th>מוסך</th><th>קבלה</th></tr>${
 list.map(s=>{const v=byId(s.vehicle_id)||{model:'?',plate:''};
 return `<tr><td>${fd(s.service_date)}</td><td>${vname(v)}</td><td>${TYPES[s.type]||esc(s.type)}</td><td>${fmt(s.km)}</td><td>₪${fmt(s.cost)}</td><td>${esc(s.garage||'')}</td><td>${s.invoice_path?`<button class="btn ghost sm" data-a="rc" data-p="${esc(s.invoice_path)}">צפייה</button>`:'—'}</td></tr>`}).join('')
 ||'<tr><td colspan="7">עוד לא נרשמו טיפולים</td></tr>'}</table></div>`;
}
function viewDash(){
 const al=alerts(),yr=new Date().getFullYear();
 const cost=D.services.filter(s=>new Date(s.service_date).getFullYear()===yr).reduce((t,s)=>t+Number(s.cost||0),0);
 return `<div class="stats"><div class="card"><small>כלי רכב</small><b>${D.vehicles.length}</b></div><div class="card"><small>דורשים טיפול</small><b>${al.length}</b></div><div class="card"><small>עלות טיפולים השנה</small><b>₪${fmt(cost)}</b></div></div>
 <h2>דורש טיפול</h2>${al.length?`<div class="card list">${al.map(x=>`<div class="row"><span>${vname(x.v)} <small>${drv(x.v.driver_id)}</small></span><span class="b ${cls(x.lvl)}">${x.txt}</span></div>`).join('')}</div>`:'<div class="card">אין התראות פתוחות</div>'}
 <h2>הצי</h2><div class="card scroll"><table><tr><th>רכב</th><th>נהג</th><th>ק"מ</th><th>סטטוס טיפול</th></tr>${D.vehicles.map(v=>{const s=svcStatus(v);return `<tr><td>${vname(v)}</td><td>${drv(v.driver_id)}</td><td>${fmt(v.km)}</td><td><span class="b ${cls(s.lvl)}">${s.txt}</span></td></tr>`}).join('')||'<tr><td colspan="4">עוד לא נוספו רכבים</td></tr>'}</table></div>`;
}
function viewManage(){
 const drivers=D.profiles.filter(p=>p.role==='driver');
 const opts=sel=>`<option value="">ללא</option>`+drivers.map(p=>`<option value="${p.id}"${p.id===sel?' selected':''}>${esc(p.full_name)}</option>`).join('');
 return `<form class="card form" data-f="rules"><h3>כללי תזכורת לטיפול תקופתי</h3><label>כל כמה ק"מ<input type="number" name="km" value="${D.settings.service_interval_km}" min="1000" required></label><label>או כל כמה חודשים<input type="number" name="months" value="${D.settings.service_interval_months}" min="1" required></label><button class="btn">עדכון כללים</button></form>
 <form class="card form" data-f="veh"><h3>הוספת רכב</h3><label>מספר רישוי<input name="plate" required></label><label>דגם<input name="model" required></label><label>שנה<input type="number" name="year" min="1990" max="2035"></label>
 <label>נהג<select name="driverId">${opts('')}</select></label>
 <label>ק"מ נוכחי<input type="number" name="km" min="0" required></label><label>תוקף טסט<input type="date" name="test"></label><label>תוקף ביטוח<input type="date" name="ins"></label><button class="btn">הוספת רכב</button></form>
 <h2>שיוך נהגים לרכבים</h2><div class="card list">${D.vehicles.map(v=>`<div class="row"><span>${vname(v)}</span><select data-assign="${v.id}">${opts(v.driver_id)}</select></div>`).join('')||'עוד אין רכבים'}</div>
 <h2>נהגים</h2><div class="card list">${drivers.map(p=>`<div class="row"><input value="${esc(p.full_name)}" aria-label="שם נהג"><button class="btn ghost sm" data-a="rename" data-id="${p.id}">שמירת שם</button></div>`).join('')||'<small>עוד אין נהגים. כדי להוסיף נהג, יוצרים לו משתמש ב-Supabase: Authentication ← Users ← Add user.</small>'}</div>`;
}
function viewDriver(){
 const v=D.vehicles[0];
 if(!v)return '<div class="card">עדיין לא שויך אליך רכב. פנה למנהל.</div>';
 const s=svcStatus(v),dc=docs(v);
 const digits=String(v.km).padStart(6,'0').split('').map(c=>`<i>${c}</i>`).join('');
 return `<div class="card"><h3>${vname(v)}</h3><small>שנה ${v.year||'—'} · טסט עד ${fd(v.test_date)} · ביטוח עד ${fd(v.insurance_date)}</small>
 <div class="odo">${digits}<small>ק"מ</small></div>
 <div class="tags"><span class="b ${cls(s.lvl)}">${s.txt}</span>${dc.map(x=>`<span class="b ${cls(x.lvl)}">${x.txt}</span>`).join('')}</div></div>
 <form class="card form" data-f="km"><input type="hidden" name="vid" value="${v.id}"><h3>עדכון קילומטראז'</h3><label>ק"מ נוכחי<input type="number" name="km" min="${v.km}" value="${v.km}" required></label><button class="btn">עדכון ק"מ</button></form>
 ${svcForm(v.id)}<h2>היסטוריית טיפולים</h2>${svcTable(D.services.filter(x=>x.vehicle_id===v.id))}`;
}
function render(){
 const m=me.role==='manager';
 $('#who').innerHTML=`<small>${esc(me.full_name)}</small><button class="btn ghost sm" data-a="out">יציאה</button>`;
 const tabs=m?[['dash','סקירה'],['hist','טיפולים'],['mng','ניהול']]:[];
 $('#tabs').innerHTML=tabs.map(([k,t])=>`<button class="tab ${ui.tab===k?'on':''}" data-a="tab" data-v="${k}">${t}</button>`).join('');
 $('#view').innerHTML=m?(ui.tab==='dash'?viewDash():ui.tab==='hist'?svcForm()+'<h2>כל הטיפולים</h2>'+svcTable(D.services):viewManage()):viewDriver();
}
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}
function res(e,ok){
 if(!e)return[1,ok];console.error(e);const m=e.message||'';
 return[0,m.includes('cannot decrease')?'הקילומטראז\' לא יכול לרדת':e.code==='23505'?'מספר הרישוי כבר קיים':'הפעולה נכשלה, נסה שוב'];
}
function shrink(file){
 return new Promise((ok,no)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{
   const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
   c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
   c.toBlob(b=>b?ok(b):no(new Error('blob')),'image/jpeg',0.8);
  };
  img.onerror=()=>{URL.revokeObjectURL(u);no(new Error('img'))};
  img.src=u;
 });
}
const H={
 async login(o){const{error}=await sb.auth.signInWithPassword({email:o.email.trim().toLowerCase(),password:o.password});if(error){console.error(error);return[0,error.name==='AuthRetryableFetchError'?'אין חיבור לשרת. פתח את האתר בכתובת רגילה בדפדפן':'אימייל או סיסמה שגויים']}await start();return[1,'']},
 async km(o){const{error}=await sb.from('km_updates').insert({vehicle_id:o.vid,km:+o.km});return res(error,'הק"מ עודכן')},
 async svc(o){
  let path=null;
  if(o.receipt&&o.receipt.size){
   toast('מעלה קבלה...');
   try{
    const blob=await shrink(o.receipt);path=`${o.vid}/${crypto.randomUUID()}.jpg`;
    const{error:ue}=await sb.storage.from('invoices').upload(path,blob,{contentType:'image/jpeg'});
    if(ue){console.error(ue);return[0,'העלאת הקבלה נכשלה, נסה שוב']}
   }catch(e){console.error(e);return[0,'לא ניתן לעבד את התמונה']}
  }
  const{error}=await sb.from('services').insert({vehicle_id:o.vid,type:o.type,service_date:o.date,km:+o.km,cost:+o.cost||0,garage:o.garage||null,invoice_path:path});
  if(error&&path)await sb.storage.from('invoices').remove([path]);
  return res(error,'הטיפול נשמר')
 },
 async veh(o){const{error}=await sb.from('vehicles').insert({plate:o.plate.trim(),model:o.model.trim(),year:num(o.year),driver_id:o.driverId||null,km:+o.km,test_date:o.test||null,insurance_date:o.ins||null});return res(error,'הרכב נוסף')},
 async rules(o){const{error}=await sb.from('settings').update({service_interval_km:+o.km,service_interval_months:+o.months}).eq('id',true);return res(error,'הכללים עודכנו')}
};
document.addEventListener('submit',async e=>{
 const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();
 const b=f.querySelector('button');b.disabled=true;
 const[ok,msg]=await H[f.dataset.f](Object.fromEntries(new FormData(f)));
 b.disabled=false;
 if(ok&&f.dataset.f!=='login'){await load(me.id);render()}
 if(msg)toast(msg);
});
document.addEventListener('click',async e=>{
 if(e.target.closest('#ov')){$('#ov').classList.remove('on');return}
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a;
 if(a==='tab'){ui.tab=b.dataset.v;render()}
 if(a==='rc'){
  const{data,error}=await sb.storage.from('invoices').createSignedUrl(b.dataset.p,300);
  if(error){toast('לא ניתן לפתוח את הקבלה');return}
  $('#ov').innerHTML=`<img src="${data.signedUrl}" alt="קבלה">`;$('#ov').classList.add('on');
 }
 if(a==='out'){await sb.auth.signOut();showLogin()}
 if(a==='rename'){
  const name=b.closest('.row').querySelector('input').value.trim();if(!name)return;
  const{error}=await sb.from('profiles').update({full_name:name}).eq('id',b.dataset.id);
  const[ok,msg]=res(error,'השם נשמר');if(ok){await load(me.id);render()}toast(msg);
 }
});
document.addEventListener('change',async e=>{
 const id=e.target.dataset.assign;if(!id)return;
 const{error}=await sb.from('vehicles').update({driver_id:e.target.value||null}).eq('id',id);
 const[ok,msg]=res(error,'השיוך עודכן');if(ok){await load(me.id);render()}toast(msg);
});
init();
</script>
</body>
</html>
